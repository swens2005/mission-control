<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="mock.css" />
        <title>Order page, desktop (v1)</title>
    </head>
    <body class="v1">
        <div class="wrap nav">
            <div class="logo">Bakkerij de Vries</div>
            <div class="links">
                <span>Home</span><span>Cakes</span><span>About us</span
                ><span>Contact</span>
            </div>
            <span class="btn">Contact</span>
        </div>
        <div class="wrap plain">
            <h2>Order form</h2>
            <p class="lead">Fill in the form and we will contact you.</p>
            <div class="order">
                <div class="panel">
                    <div class="row">
                        <div class="field">
                            <label>Name</label>
                            <div class="input"></div>
                        </div>
                        <div class="field">
                            <label>Email</label>
                            <div class="input"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Date</label>
                            <div class="input">dd-mm-yyyy</div>
                        </div>
                        <div class="field">
                            <label>Guests</label>
                            <div class="input"></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>Cake</label>
                        <div class="input">Choose…</div>
                    </div>
                    <div class="field">
                        <label>Message</label>
                        <div class="input" style="height: 140px"></div>
                    </div>
                    <div class="ctas"><span class="btn">Send</span></div>
                </div>
                <div class="panel summary">
                    <h3>Questions?</h3>
                    <p class="note">
                        Call us on 020 123 45 67 or visit the shop.
                    </p>
                </div>
            </div>
        </div>
        <footer>
            <div class="wrap">
                <div class="logo">Bakkerij de Vries</div>
                <div>Meeuwenlaan 12, Amsterdam</div>
            </div>
        </footer>
    </body>
</html>
