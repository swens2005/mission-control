<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="mock.css" />
        <title>Order page, mobile (v2)</title>
    </head>
    <body class="m">
        <div class="wrap nav">
            <div class="logo">
                Bakkerij de Vries<small>Wedding cakes</small>
            </div>
            <div class="burger"></div>
        </div>
        <div class="wrap plain">
            <span class="eyebrow">Order a wedding cake</span>
            <h2>Tell us about your day</h2>
            <div class="steps">
                <span class="step on"><b>1</b>Your wedding</span
                ><span class="step"><b>2</b>The cake</span>
            </div>
            <div class="order">
                <div class="panel">
                    <div class="field">
                        <label>Wedding date</label>
                        <div class="input">Sat 12 June 2027</div>
                    </div>
                    <div class="field">
                        <label>Number of guests</label>
                        <div class="input">80</div>
                    </div>
                    <div class="field">
                        <label>Which cake?</label>
                        <div class="chips">
                            <span class="chip">Classic</span
                            ><span class="chip on">Naked</span
                            ><span class="chip">Seasonal</span>
                        </div>
                    </div>
                    <div class="ctas">
                        <span class="btn">Next: the cake</span>
                    </div>
                </div>
                <div class="panel summary">
                    <h3>Your estimate</h3>
                    <div class="line">
                        <span>Naked, 3 tiers</span><span>€415</span>
                    </div>
                    <div class="line">
                        <span>Delivery</span><span>€45</span>
                    </div>
                    <div class="total"><span>Total</span><span>€460</span></div>
                </div>
            </div>
        </div>
        <footer>
            <div class="wrap"><div class="logo">Bakkerij de Vries</div></div>
        </footer>
    </body>
</html>
